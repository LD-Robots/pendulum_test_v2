# Variant 3 — stock JointGroupEffortController + external Python setpoint node.
# The controller forwards raw torques; pd_setpoint_node.py does the PD math
# in user-space at 200 Hz.

controller_manager:
  ros__parameters:
    update_rate: 1000
    thread_priority: 80
    lock_memory: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    pendulum_effort_controller:
      type: effort_controllers/JointGroupEffortController

pendulum_effort_controller:
  ros__parameters:
    joints: [pendulum_joint]
