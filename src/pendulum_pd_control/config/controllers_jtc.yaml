# Variant 2 — stock joint_trajectory_controller with effort + gains.
# Pulled from pd_tuning_guide.html §11. Gravity FF is NOT available here;
# `ff_acceleration_scale` covers inertia only. Steady-state error under
# gravity is the known limitation of this variant vs variants 1 and 3.

controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    pendulum_jtc:
      type: joint_trajectory_controller/JointTrajectoryController

pendulum_jtc:
  ros__parameters:
    joints: [pendulum_joint]
    command_interfaces: [effort]
    state_interfaces:   [position, velocity]
    allow_partial_joints_goal: true
    open_loop_control: false

    gains:
      pendulum_joint:
        p: 22.95           # Kp from pd_tuning_guide §05
        d: 2.14            # Kd
        i: 0.0
        ff_velocity_scale:     0.05    # Fv (viscous friction)
        ff_acceleration_scale: 0.102   # J  (inertia FF)
