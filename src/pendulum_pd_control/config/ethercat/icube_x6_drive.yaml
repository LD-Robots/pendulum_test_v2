# EtherCAT slave config for the pendulum's single myActuator X6 drive.
# Drive boots into CST (mode 10); the host PD writes the `effort` command
# interface, all other PDO channels are unused command-side.
#
# Object indices / padding match the 2026-04-24 firmware ESI
# (docs/MT-Device_260424.xml). The TxPDO is a custom 0x1A02 mapping that
# carries the standard CiA-402 status objects plus the full telemetry set
# the new firmware exposes (temps, bus voltage, encoder, filtered vel/torque,
# position demand, following error). The iCube driver writes both the PDO
# mapping and the SM-PDO assignment, so a custom channel list is fine.
#
# Effort factors from docs/motor_specs.md X6 drive #0 calibration row:
#   SI -> raw : 37.14 (Nm -> per-mille rated current)
#   raw -> SI : 0.02693 (per-mille rated current -> Nm)
# These are rig-specific; recalibrate before deploy on a different drive.

vendor_id:  0x00202008
product_id: 0x00000000
assign_activate: 0x0300          # DC sync mode
auto_fault_reset: true
auto_state_transitions: true
mode_of_operation: 10            # CST (Cyclic Synchronous Torque) — matches xacro default

sdo:
  - {index: 0x6072, sub_index: 0, type: uint16, value: 800}    # max_torque 80% of rated current
  - {index: 0x60C2, sub_index: 1, type: int8,   value: 1}      # interpolation time = 1
  - {index: 0x60C2, sub_index: 2, type: int8,   value: -3}     # base 10^-3 s -> 1 ms cycle

rpdo:   # Master -> Slave (16 bytes)
  - index: 0x1600
    channels:
      - {index: 0x6040, sub_index: 0, type: uint16, command_interface: ~,       default: 0}      # control_word
      - {index: 0x607a, sub_index: 0, type: int32,  command_interface: ~,       default: 0}      # target_position — unused in CST
      - {index: 0x60ff, sub_index: 0, type: int32,  command_interface: ~,       default: 0}      # target_velocity — unused in CST
      - {index: 0x6071, sub_index: 0, type: int16,  command_interface: effort,  factor: 37.14}   # target_torque (rig-specific)
      - {index: 0x6072, sub_index: 0, type: int16,  command_interface: ~,       default: 800}    # max_torque
      - {index: 0x6060, sub_index: 0, type: int8,   command_interface: ~,       default: 10}     # mode = CST, no runtime switching
      - {index: 0x2ffd, sub_index: 0, type: int8,   command_interface: ~,       default: 0}      # Dummy Byte1 (padding)

tpdo:   # Slave -> Master — custom 0x1A02: status + full telemetry (46 bytes)
  - index: 0x1a02
    channels:
      - {index: 0x6041, sub_index: 0, type: uint16, state_interface: ~}                                  # status_word (read by CiA-402 plugin)
      - {index: 0x6064, sub_index: 0, type: int32,  state_interface: position,          factor: 4.794e-5}  # actual_position (rad)
      - {index: 0x606c, sub_index: 0, type: int32,  state_interface: velocity,          factor: 4.794e-5}  # actual_velocity (rad/s)
      - {index: 0x6077, sub_index: 0, type: int16,  state_interface: effort,            factor: 0.02693}   # actual_torque (Nm, rig-specific)
      - {index: 0x603f, sub_index: 0, type: uint16, state_interface: ~}                                  # error_code (read by CiA-402 plugin)
      - {index: 0x6061, sub_index: 0, type: int8,   state_interface: ~}                                  # mode_display (read by CiA-402 plugin)
      - {index: 0x2009, sub_index: 0, type: int16,  state_interface: motor_temperature, factor: 1.0}       # motor temperature (degC)
      - {index: 0x200c, sub_index: 0, type: int16,  state_interface: drive_temperature, factor: 1.0}       # drive/MOSFET temperature (degC)
      - {index: 0x200a, sub_index: 0, type: uint16, state_interface: bus_voltage,       factor: 1.0}       # bus voltage (V, rounded int)
      - {index: 0x200b, sub_index: 0, type: int32,  state_interface: first_encoder,     factor: 1.0}       # first encoder value (absolute pulses, raw)
      - {index: 0x200d, sub_index: 0, type: int32,  state_interface: filtered_velocity, factor: 4.794e-5}  # filtered velocity (rad/s)
      - {index: 0x200f, sub_index: 0, type: int16,  state_interface: filtered_torque,   factor: 0.02693}   # filtered torque (Nm, rig-specific)
      - {index: 0x6062, sub_index: 0, type: int32,  state_interface: position_demand,   factor: 4.794e-5}  # position demand value (rad)
      - {index: 0x60f4, sub_index: 0, type: int32,  state_interface: following_error,   factor: 4.794e-5}  # following error actual (rad)
      - {index: 0x2ffe, sub_index: 0, type: int8,   state_interface: ~}                                  # Dummy Byte2 (padding -> even byte count)
